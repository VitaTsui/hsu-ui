name: release
on:
  push:
    # 这个仓库是 1.x（antd v5）线，main 与 1.x 都视为该线的发布分支。
    # 2.x 在 VitaTsui/hsu-ui-v2，那边负责 npm 的 latest。
    #
    # 注意：push 触发的 workflow 用的是**被推分支上的那份文件**。所以这个文件必须同时
    # 存在于每一条发布分支上，否则往 1.x 推什么都不会发生。
    branches:
      - main
      - "[0-9]+.x"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号、决定 dist-tag 并检查 tag
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          MAJOR=${VERSION%%.*}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 这个仓库只维护 1.x（antd v5）线，2.x 在 VitaTsui/hsu-ui-v2。两个仓库发的是
          # **同一个 npm 包**，所以这里**永远不发 latest** —— latest 归 2.x 那边。
          # 否则一次 1.x 的补丁发布，会让所有人的 `npm i @hsu-react/ui` 退回 antd v5 线。
          #
          # 装 1.x 不依赖 dist-tag：`npm i @hsu-react/ui@1` 走的是 semver，自动取最高的
          # 1.x.x。dist-tag 在这里的唯一作用就是「别去动 latest」。
          #
          # 名字不能取成 `v1` / `1` / `1.x` 这类 —— npm 会拒绝任何能被解析成 semver 范围的
          # dist-tag（报 "Tag name must not be a valid SemVer range"），实测踩过。
          echo "dist_tag=legacy-$MAJOR" >> "$GITHUB_OUTPUT"

          # GitHub Release 的 Latest 标记是仓库内部的事，和 npm 无关，正常标上
          echo "latest_flag=--latest" >> "$GITHUB_OUTPUT"

          if [ "$BRANCH" != "main" ]; then
            BRANCH_MAJOR=${BRANCH%%.x}
            if [ "$MAJOR" != "$BRANCH_MAJOR" ]; then
              echo "::error::分支 $BRANCH 上的版本号是 $VERSION，大版本对不上。维护分支只能发 ${BRANCH_MAJOR}.x.x"
              exit 1
            fi
          fi

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag $TAG 已存在，跳过发布"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 检查 npm 上是否已存在该版本
        if: steps.ver.outputs.skip != 'true'
        id: npmver
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 已在 npm 上，跳过 publish"
          fi

      - name: 安装依赖（publish 时 prepublishOnly 自动构建）
        if: steps.ver.outputs.skip != 'true' && steps.npmver.outputs.published != 'true'
        run: yarn install --frozen-lockfile

      - name: 发布 npm
        if: steps.ver.outputs.skip != 'true' && steps.npmver.outputs.published != 'true'
        run: npm publish --access public --tag "${{ steps.ver.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 打 tag 并生成 Release
        if: steps.ver.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.ref_name }}" \
            "${{ steps.ver.outputs.latest_flag }}"
        env:
          GH_TOKEN: ${{ github.token }}
